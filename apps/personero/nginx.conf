server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La API y el frontend se sirven bajo el mismo origen: nginx hace de
    # gateway hacia el contenedor "api" por la red interna de Docker Compose.
    # Esto evita CORS y permite exponer un solo puerto/dominio hacia afuera.
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta no encontrada cae al index para que React Router la maneje.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
